name: Snapshot
on:
  workflow_dispatch:
concurrency:
  # Manual repacks must not queue behind (or delay) the 5-minute ingest cron;
  # the Durable Object publisher lease already fences concurrent R2 commits.
  group: jingkan-snapshot-manual
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Repack current R2 state with fenced activation
        env:
          JINGKAN_BASE_URL: https://jing.show
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          X_TRUSTED_HANDLES: ${{ vars.X_TRUSTED_HANDLES || '' }}
          X_HOT_GATE: ${{ vars.X_HOT_GATE || '1' }}
        run: npm run snapshot
