name: Snapshot
on:
  workflow_dispatch:
concurrency:
  group: jingkan-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Repack current R2 state with fenced activation
        env:
          JINGKAN_BASE_URL: https://jing.show
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: npm run snapshot
