name: Ingest
on:
  schedule:
    # Active Beijing hours (08:00–23:55 BJT = 00:00–15:55 UTC): every 5 minutes.
    - cron: '*/5 0-15 * * *'
    # Overnight quiet hours (00:00–05:00 BJT = 16:00–21:00 UTC): once per hour
    # for Beijing midnight rollover and overnight user enrichment events.
    - cron: '0 16-21 * * *'
    # Morning hourly windows (06:00–06:10 & 07:00–07:10 BJT = 22:00 & 23:00 UTC):
    # keep two ticks (:00 and :05) so a delayed GitHub Actions run does not miss
    # the entire 10-minute fetch window.
    - cron: '0,5 22,23 * * *'
  workflow_dispatch:
    inputs:
      force_fetch:
        description: Fetch all sources immediately
        type: boolean
        default: true
      translation_limit:
        description: Maximum titles to translate, including repair of old untranslated results
        type: number
        default: 60
      dedupe_dry_run:
        description: Log NodeSeek duplicate candidates without hiding them
        type: boolean
        default: false
      dedupe_reset:
        description: Clear all NodeSeek duplicate markers once
        type: boolean
        default: false
      cluster_dry_run:
        description: Log cross-source merge candidates without merging them
        type: boolean
        default: false
      cluster_reset:
        description: Clear all cross-source cluster markers once
        type: boolean
        default: false
concurrency:
  # A manual maintenance run (force fetch, dedupe/cluster reset) gets its own
  # slot so the 5-minute cron can never cancel it while it is queued.
  group: ${{ github.event_name == 'workflow_dispatch' && 'jingkan-publisher-manual' || 'jingkan-publisher' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Merge sources and publish immutable R2 state
        env:
          JINGKAN_BASE_URL: https://jing.show
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          PREWARM_TRANSLATIONS: ${{ vars.PREWARM_TRANSLATIONS || '1' }}
          TITLE_TRANSLATION_LIMIT: ${{ inputs.translation_limit || '60' }}
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fetch && '1' || '0' }}
          NODESEEK_DEDUPE: ${{ vars.NODESEEK_DEDUPE || '0' }}
          NODESEEK_DEDUPE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dedupe_dry_run && '1' || vars.NODESEEK_DEDUPE_DRY_RUN || '0' }}
          NODESEEK_DEDUPE_RESET: ${{ github.event_name == 'workflow_dispatch' && inputs.dedupe_reset && '1' || '0' }}
          NODESEEK_DEDUPE_WINDOW_DAYS: ${{ vars.NODESEEK_DEDUPE_WINDOW_DAYS || '7' }}
          NODESEEK_DEDUPE_MAX_CHECKS: ${{ vars.NODESEEK_DEDUPE_MAX_CHECKS || '20' }}
          NODESEEK_DEDUPE_MAX_CANDIDATES: ${{ vars.NODESEEK_DEDUPE_MAX_CANDIDATES || '5' }}
          NODESEEK_DEDUPE_LEXICAL: ${{ vars.NODESEEK_DEDUPE_LEXICAL || '0.18' }}
          NODESEEK_DEDUPE_COSINE: ${{ vars.NODESEEK_DEDUPE_COSINE || '0.82' }}
          NODESEEK_DEDUPE_TEXT_CHARS: ${{ vars.NODESEEK_DEDUPE_TEXT_CHARS || '500' }}
          NODESEEK_DEDUPE_MAX_TEXTS: ${{ vars.NODESEEK_DEDUPE_MAX_TEXTS || '120' }}
          NODESEEK_DEDUPE_TIMEOUT_MS: ${{ vars.NODESEEK_DEDUPE_TIMEOUT_MS || '20000' }}
          X_TRUSTED_HANDLES: ${{ vars.X_TRUSTED_HANDLES || '' }}
          X_HOT_GATE: ${{ vars.X_HOT_GATE || '1' }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY || '' }}
          CROSS_SOURCE_CLUSTER: ${{ vars.CROSS_SOURCE_CLUSTER || '0' }}
          CROSS_SOURCE_CLUSTER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster_dry_run && '1' || vars.CROSS_SOURCE_CLUSTER_DRY_RUN || '0' }}
          CROSS_SOURCE_CLUSTER_RESET: ${{ github.event_name == 'workflow_dispatch' && inputs.cluster_reset && '1' || '0' }}
          CROSS_SOURCE_CLUSTER_WINDOW_DAYS: ${{ vars.CROSS_SOURCE_CLUSTER_WINDOW_DAYS || '3' }}
          CROSS_SOURCE_CLUSTER_MAX_CHECKS: ${{ vars.CROSS_SOURCE_CLUSTER_MAX_CHECKS || '40' }}
          CROSS_SOURCE_CLUSTER_MAX_CANDIDATES: ${{ vars.CROSS_SOURCE_CLUSTER_MAX_CANDIDATES || '5' }}
          CROSS_SOURCE_CLUSTER_LEXICAL: ${{ vars.CROSS_SOURCE_CLUSTER_LEXICAL || '0.18' }}
          CROSS_SOURCE_CLUSTER_COSINE: ${{ vars.CROSS_SOURCE_CLUSTER_COSINE || '0.86' }}
          CROSS_SOURCE_CLUSTER_TEXT_CHARS: ${{ vars.CROSS_SOURCE_CLUSTER_TEXT_CHARS || '500' }}
          CROSS_SOURCE_CLUSTER_MAX_TEXTS: ${{ vars.CROSS_SOURCE_CLUSTER_MAX_TEXTS || '160' }}
          CROSS_SOURCE_CLUSTER_TIMEOUT_MS: ${{ vars.CROSS_SOURCE_CLUSTER_TIMEOUT_MS || '20000' }}
        run: npm run ingest
