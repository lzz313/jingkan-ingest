name: Ingest
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_fetch:
        description: Fetch all sources immediately
        type: boolean
        default: true
concurrency:
  group: jingkan-publisher
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Merge sources and publish immutable R2 state
        env:
          JINGKAN_BASE_URL: https://jing.show
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          PREWARM_TRANSLATIONS: ${{ vars.PREWARM_TRANSLATIONS || '1' }}
          FORCE_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fetch && '1' || '0' }}
        run: npm run ingest
