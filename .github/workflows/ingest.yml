name: Ingest

# Scheduled workflows only run from the default branch (main).
on:
  schedule:
    # Beijing time (UTC+8):
    #   08:30-11:50 and 13:00-17:50 and 19:00-23:30 every 10 minutes
    #   12:30 and 18:30 once
    - cron: '30,40,50 0 * * *'
    - cron: '*/10 1-3,5-9,11-14 * * *'
    - cron: '30 4,10 * * *'
    - cron: '0,10,20,30 15 * * *'
  workflow_dispatch:

concurrency:
  group: jingkan-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and write to D1
        env:
          JINGKAN_BASE_URL: https://jing.show
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          PREWARM_TRANSLATIONS: ${{ vars.PREWARM_TRANSLATIONS || '1' }}
        run: npm run ingest

      - name: Backfill translations
        # An unset variable compares equal to '0' after GitHub's numeric
        # coercion, so test for empty explicitly; the script also gates.
        if: ${{ vars.PREWARM_TRANSLATIONS == '' || vars.PREWARM_TRANSLATIONS != '0' }}
        continue-on-error: true
        env:
          JINGKAN_BASE_URL: https://jing.show
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          PREWARM_TRANSLATIONS: ${{ vars.PREWARM_TRANSLATIONS || '1' }}
        run: npm run backfill
